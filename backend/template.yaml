AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NutriMate - AI supplement shop. S3 static website (+ optional CloudFront), Cognito user pool,
  HTTP API + Lambda, DynamoDB, EventBridge rules, SNS and SSM Parameter Store (Gemini + OpenAQ keys).
  AWS Academy Learner Lab compatible: creates no IAM roles or policies (all functions use LabRole)
  and no CloudFront Origin Access Control.

Parameters:
  AdminEmail:
    Type: String
    Description: Email that receives low-stock alerts (confirm the SNS email after deploy).
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  GeminiModel:
    Type: String
    Default: gemini-flash-latest
    Description: Gemini model id used by the planner and the weekly signal (e.g. gemini-flash-latest, gemini-2.5-flash).
  UseCloudFront:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: '"true" = HTTPS CloudFront in front of the S3 website. "false" = use the S3 website URL (http) directly.'

Conditions:
  UseCF: !Equals [!Ref UseCloudFront, 'true']

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        USERS_TABLE: !Ref UsersTable
        PLANS_TABLE: !Ref PlansTable
        ORDERS_TABLE: !Ref OrdersTable
        SITE_URL: !If [UseCF, !Sub 'https://${Distribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]
        GEMINI_MODEL: !Ref GeminiModel
        GEMINI_KEY_PARAM: /supp/gemini-api-key
        OPENAQ_KEY_PARAM: /supp/openaq-api-key

Resources:
  # ---------------------------------------------------------------- S3 (+ optional CloudFront)
  # Learner Lab denies cloudfront:CreateOriginAccessControl, so the site is a public
  # S3 static website and CloudFront (optional) uses the website endpoint as a custom origin.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html # SPA: unknown paths (e.g. /cart) load the app
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Admin browsers upload with presigned PUT URLs (the URL itself is the access control).
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadImages
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${ImagesBucket.Arn}/*

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCF
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: NutriMate site (S3 website origin)
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site-website
            # WebsiteURL = http://<bucket>.s3-website-<region>.amazonaws.com -> keep only the host
            DomainName: !Select [2, !Split ['/', !GetAtt SiteBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only # S3 website endpoints only speak HTTP
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: site-website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        # SPA fallback: unknown paths return index.html with 200
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ---------------------------------------------------------------- Cognito
  # No hosted UI / domain: the React app has its own /login and /signup pages (Amplify signIn/signUp).
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: nutrimate-web
      GenerateSecret: false
      # USER_PASSWORD_AUTH needs no browser crypto, so sign-in also works on the http S3 website URL.
      # The password still travels over HTTPS to the Cognito API.
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Can add products, upload images and edit stock

  # ---------------------------------------------------------------- DynamoDB
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: productId, AttributeType: S }
      KeySchema:
        - { AttributeName: productId, KeyType: HASH }

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: createdAt, KeyType: RANGE }

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: orderId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: orderId, KeyType: RANGE }

  # ---------------------------------------------------------------- SNS
  SignalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: supp-wellness-signal
      DisplayName: NutriMate

  AdminTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: supp-admin-alerts
      DisplayName: NutriMate Admin
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  # ---------------------------------------------------------------- HTTP API
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !If [UseCF, !Sub 'https://${Distribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]
          - http://localhost:5173
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, PUT, POST, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # ---------------------------------------------------------------- Lambda functions
  # AWS Academy Learner Lab: the stack must not create IAM roles/policies.
  # Every function runs as the pre-existing LabRole (it already allows DynamoDB, S3, SNS, SSM, Logs).
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: products.handler
      Description: Product list/detail, admin add/edit, presigned image upload
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          # Product images are served straight from S3 (public-read bucket policy)
          IMAGES_BASE_URL: !Sub https://${ImagesBucket.RegionalDomainName}
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/products, Method: GET, Auth: { Authorizer: NONE } }
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: '/api/products/{id}', Method: GET, Auth: { Authorizer: NONE } }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/products, Method: POST }
        Upload:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/uploads, Method: POST }

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cart.handler
      Description: Read / replace the cart
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/cart, Method: GET }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/cart, Method: PUT }

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders.handler
      Description: Cart to order (reduces stock), list my orders
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/orders, Method: POST }
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/orders, Method: GET }

  QuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: quiz.handler
      Description: Lifestyle quiz -> Gemini plan; latest plan
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 29
      MemorySize: 512
      Events:
        Submit:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/quiz, Method: POST }
        Latest:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/plans/latest, Method: GET }

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: me.handler
      Description: City + weekly signal opt-in (SNS subscribe/unsubscribe)
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          SIGNAL_TOPIC_ARN: !Ref SignalTopic
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/me, Method: GET }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /api/me, Method: PUT }

  WeeklySignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: weeklySignal.handler
      Description: Monday 08:00 Bangkok - PM2.5 + Gemini note -> SNS email per user
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SIGNAL_TOPIC_ARN: !Ref SignalTopic

  LowStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lowStock.handler
      Description: Daily email to admin when a product's stock is below 10
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          ADMIN_TOPIC_ARN: !Ref AdminTopic

  # ---------------------------------------------------------------- EventBridge schedules
  # Plain EventBridge rules (cron is UTC; Bangkok = UTC+7, no daylight saving).
  # Rules invoke Lambda through a resource-based permission, so no IAM role is needed.
  WeeklySignalRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-weekly-signal
      Description: Wellness Signal email every Monday 08:00 Asia/Bangkok (01:00 UTC)
      ScheduleExpression: cron(0 1 ? * MON *)
      State: ENABLED
      Targets:
        - Id: weekly-signal
          Arn: !GetAtt WeeklySignalFunction.Arn

  WeeklySignalPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WeeklySignalFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WeeklySignalRule.Arn

  LowStockRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-low-stock
      Description: Daily low-stock check 09:00 Asia/Bangkok (02:00 UTC)
      ScheduleExpression: cron(0 2 * * ? *)
      State: ENABLED
      Targets:
        - Id: low-stock
          Arn: !GetAtt LowStockFunction.Arn

  LowStockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LowStockFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LowStockRule.Arn

Outputs:
  ApiUrl:
    Description: HTTP API base URL (frontend calls ApiUrl + /api/...)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  SiteBucket:
    Value: !Ref SiteBucket
  ImagesBucket:
    Value: !Ref ImagesBucket
  DistributionId:
    Description: CloudFront distribution id, or "none" when UseCloudFront=false
    Value: !If [UseCF, !Ref Distribution, 'none']
  SiteUrl:
    Description: Open this URL (CloudFront https, or the S3 website http URL)
    Value: !If [UseCF, !Sub 'https://${Distribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]
  ProductsTable:
    Description: Used by scripts/seed.mjs
    Value: !Ref ProductsTable
